name: Build and deploy WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-webgl
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL with Unity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: StuntCar.EditorTools.BuildScript.BuildWebGL
          allowDirtyBuild: true

      # On failure, copy Unity's errors into run annotations so they can be read without
      # downloading the full log (the runner keeps each step's log under _diag/pages).
      - name: Report Unity errors
        if: failure()
        run: |
          logs=$(sudo find / -path '*/_diag/pages/*.log' -mmin -120 2>/dev/null)
          [ -z "$logs" ] && { echo "::warning::No runner step logs found"; exit 0; }
          pattern='error CS|[Ee]xception|\[StuntCar\]|Scripts have compiler errors|Build Failed|BuildFailed|Aborting batchmode|Failed to|error:|Error:|License|Licensing|Package Manager|Cannot|not found'
          sudo cat $logs | sed 's/^[0-9TZ:.-]* //' | grep -E "$pattern" | grep -v '::' | awk '!seen[$0]++' | head -n 10 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
          tail=$(sudo cat $logs | sed 's/^[0-9TZ:.-]* //' | grep -v '::' | grep -vE '^\s*$' | tail -n 60 | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::warning title=Last 60 log lines::$tail"

      - name: Collect the playable build
        run: |
          index=$(sudo find build -name index.html -not -path "*/TemplateData/*" | head -n 1)
          if [ -z "$index" ]; then echo "No index.html produced"; sudo find build -maxdepth 4; exit 1; fi
          mkdir -p site
          sudo cp -r "$(dirname "$index")"/. site/
          sudo chown -R "$(id -u):$(id -g)" site
          touch site/.nojekyll
          du -sh site; ls -la site site/Build

      - name: Upload build (downloadable zip)
        uses: actions/upload-artifact@v4
        with:
          name: StuntCarRacer-WebGL
          path: site

      - name: Upload for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
