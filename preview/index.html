<title>Stunt Car Racer Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
  /* Layout: full-screen 3D arena with HUD and menus floated over it, arcade-signage type. */
  :root {
    --bg: #0b1016;

    --fg: #eef2f5;
    --muted: #9aa8b4;

    --accent-2: #ffc23a;      /* boost amber */
    --good: #6fd38a;
    --crack: #ff5a3c;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;

  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--body); }

  #c { display: block; width: 100%; height: 100%; outline: none; }

  .hud-tr .vs { font-size: 14px; color: rgba(238,242,245,.85); }
  .chassis { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(460px, 46vw); height: 40px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px; }
  .chassis span { position: absolute; left: 8px; top: 3px; font-size: 10px; letter-spacing: .14em; color: var(--muted); }
  .chassis svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud-bl { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(240px, 40vw); }
  .label { font-size: 12px; letter-spacing: .16em; color: rgba(238,242,245,.85); }
  .bar { height: 14px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a1f, var(--accent-2)); transform-origin: left; }
  .hud-br { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: right; }

  /* Menus */
  .screen { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
            padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

  .tbtn { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; border-radius: 50%; background: rgba(9,14,20,.5); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 2px 8px rgba(0,0,0,.35); color: var(--fg); pointer-events: auto; touch-action: none; font-family: var(--hud); font-weight: 700; font-size: 13px; display: grid; place-items: center; user-select: none; -webkit-user-select: none; }

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
"use strict";
// Stunt Car Racer preview: a browser port of the Unity remake (same tracks, car physics,
// crane, damage, AI and league). Numbers match Assets/Scripts so tuning carries back.
(function () {
if (!window.THREE) { const e = document.getElementById("err"); e.hidden = false; e.textContent = "Couldn't load the 3D engine. Check your connection and reload."; return; }
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const MPH = 2.23694;

// ============================================================== tracks
// Same control points as TrackLibrary.cs; Unity z is flipped so the layouts look identical.
const H = 8, BANK = 9;
function P(x, y, z, bank = 0, hint = 999, min = 0, gap = false) { return { p: new V3(x, y, -z), bank, hint, min, gap }; }

  for (let i = 1; i < steps; i++) {

  }

}
const TRACKS = [];
function T(name, division, desc, pts) { TRACKS.push({ name, division, desc, pts }); }
T("Little Ramp", 4, "A gentle oval with a small launch ramp. Learn the car here.", [
  P(0,H,0), P(40,H,0), P(80,H,0), ...Bend(80,50,50,-90,90,5), P(80,H,100), P(40,H,100),
  P(18,H+2.2,100,0,40), P(4,H+2.6,100,0,40), P(-14,H,100), P(-50,H,100), P(-80,H,100),
  ...Bend(-80,50,50,90,270,5), P(-80,H,0), P(-40,H,0)]);
T("Hump Back", 4, "One big hump. Too fast over the top and you'll land hard.", [
  P(0,H,0), P(50,H,0), P(100,H,0), ...Bend(100,55,55,-90,90,5), P(100,H,110), P(55,H,110),
  P(28,H+4.5,110,0,34), P(10,H+6.5,110,0,30), P(-8,H+6.5,110,0,30), P(-26,H+4.5,110,0,34),
  P(-55,H,110), P(-100,H,110), ...Bend(-100,55,55,90,270,5), P(-100,H,0), P(-50,H,0)]);
(() => { const p = [P(0,H,0), P(50,H,0), P(90,H,0), ...Bend(90,50,50,-90,90,5), P(90,H,100), P(60,H,100)];
  let x = 48; for (let i = 0; i < 4; i++) { p.push(P(x,H+2.4,100,0,36)); p.push(P(x-9,H,100,0,36)); x -= 18; }
  p.push(P(-40,H,100), P(-90,H,100), ...Bend(-90,50,50,90,270,5), P(-90,H,0), P(-45,H,0));
  T("Stepping Stones", 3, "Four humps in a row. Keep it straight and skip across the tops.", p); })();
T("Big Ramp", 3, "Climb ten metres, then a steep drop. Brace for the landing.", [
  P(0,H,0), P(45,H,0), P(90,H,0), ...Bend(90,40,40,-90,90,5,H,H,12), P(90,H,80), P(60,H+1,80),
  P(35,H+6,80,0,38), P(15,H+10,80,0,36), P(2,H+10.5,80,0,34), P(-12,H+5,80), P(-35,H+1,80), P(-70,H,80),
  ...Bend(-70,40,40,90,270,5,H,H,12), P(-70,H,0), P(-35,H,0)]);
T("Ski Jump", 2, "Plunge off the high deck and fly the gap at the bottom.", [
  P(0,H,0), P(50,H+1.5,0), P(100,H+4,0), ...Bend(100,55,55,-90,90,5,H+4,H+12), P(100,H+12,110), P(72,H+12,110),
  Jump(48,H+6,110,30), Jump(28,H+1.5,110,32), Takeoff(14,H+3,110,32), P(-12,H+0.5,110,0,40), P(-40,H,110), P(-100,H,110),
  ...Bend(-100,55,55,90,270,5), P(-100,H,0), P(-50,H,0)]);
T("Draw Bridge", 2, "The bridge is up. Carry enough speed to clear the gap.", [
  P(0,H,0), P(50,H,0), P(100,H,0), ...Bend(100,55,55,-90,90,5), P(100,H,110), P(62,H,110),
  Jump(38,H+2.5,110,33), Takeoff(22,H+3.6,110,33), P(2,H+2.4,110,0,40), P(-16,H+1.0,110), P(-45,H,110), P(-100,H,110),
  ...Bend(-100,55,55,90,270,5), P(-100,H,0), P(-50,H,0)]);
T("High Jump", 1, "A steep kicker over a long gap. Too slow and you drop; too fast and you crack.", [
  P(0,H,0), P(50,H,0), P(100,H,0), ...Bend(100,60,60,-90,90,5), P(100,H,120), Jump(70,H,120,30),
  Jump(48,H+3,120,33), Takeoff(34,H+5.5,120,33), P(6,H+4.5,120,0,40), P(-22,H+2,120), P(-52,H,120), P(-100,H,120),
  ...Bend(-100,60,60,90,270,5), P(-100,H,0), P(-50,H,0)]);
T("Roller Coaster", 1, "Figure of eight. Over the top, round, then underneath your own track.", (() => { const R = -9; return [
  P(-60,H+2,15), P(-20,H+7,38,0,40), P(0,H+10,50,0,36), P(25,H+9,65), P(60,H+8,85,R*0.5), P(100,H+7,97,R),
  P(132,H+5,72,R), P(132,H+3,30,R), P(100,H+1,4,R), P(60,H,15,R*0.5), P(28,H+2.5,33,0,34), P(0,H,50),
  P(-28,H+2.5,67,0,34), P(-60,H,85,BANK*0.5), P(-100,H+2,97,BANK), P(-132,H+4,72,BANK), P(-132,H+4,30,BANK), P(-100,H+3,4,BANK)]; })());

// ============================================================== track runtime
const WIDTH = 8, HW = 4, THICK = 0.6, KERB = 0.7, SPACING = 2;
// Kerbs slope up from flush with the asphalt to KERB_H at the deck edge, as in Track.cs. The
// profile is [fraction of KERB across, fraction of KERB_H up], from the inner edge out.
const KERB_H = 0.09, KERB_BLOCK = 1.5, EDGE_LINE = 0.12, KERB_PROFILE = [[0, 0], [0.4, 0.5], [0.8, 0.89], [1, 1]];

function deckTop(lat) {
  const x = (Math.abs(lat) - (HW - KERB)) / KERB;
  if (x <= 0) return { h: 0, slope: 0, kerb: false };
  for (let k = 1; k < KERB_PROFILE.length; k++) {
    const [x0, y0] = KERB_PROFILE[k - 1], [x1, y1] = KERB_PROFILE[k];
    if (x <= x1 || k === KERB_PROFILE.length - 1) {
      const t = Math.min(1, (x - x0) / (x1 - x0));
      return { h: KERB_H * (y0 + (y1 - y0) * t), slope: Math.sign(lat) * KERB_H * (y1 - y0) / ((x1 - x0) * KERB), kerb: true };
    }

function catmull(p0, p1, p2, p3, t) {

  return o;
}
class Track {
  constructor(def) {
    this.def = def;
    const pts = def.pts, n = pts.length, c = [], bank = [], hint = [], min = [], gap = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const steps = Math.max(2, Math.ceil(p1.p.distanceTo(p2.p) / SPACING));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        c.push(catmull(p0.p, p1.p, p2.p, p3.p, t));

      }

    const N = c.length; this.N = N; this.c = c; this.gap = gap; this.ai = hint; this.aiMin = min;
    this.f = []; this.r = []; this.u = []; this.d = [0];

function aiDrive(r, skill) {
  const tr = r.track, car = r.car, i = r.index, speed = car.speed;
  const aim = tr.C(tr.ahead(i, 7 + Math.max(0, speed) * 0.45));
  const local = aim.clone().sub(car.p).applyQuaternion(car.q.clone().invert());
  const angle = Math.atan2(local.x, local.z) * 180 / Math.PI; // +x is the car's left
  car.steer = clamp(-angle / Math.max(4, car.maxSteerNow), -1, 1);
  let target = Math.min(tr.ai[tr.ahead(i, 6)], tr.ai[tr.ahead(i, 20)] + 6) * skill;
  const minS = Math.max(tr.aiMin[tr.ahead(i, 4)], tr.aiMin[tr.ahead(i, 30)]);
  target = Math.max(target, minS * 1.05);
  if (car.grounded === 0) { car.throttle = 0; car.brake = 0; }
  else if (speed < target - 1) { car.throttle = 1; car.brake = 0; }
  else if (speed > target + 2) { car.throttle = 0; car.brake = clamp((speed - target) / 6, 0, 1); }
  else { car.throttle = 0.35; car.brake = 0; }
  const straight = Math.min(tr.ai[tr.ahead(i, 30)], tr.ai[tr.ahead(i, 60)]);
  car.boost = car.boostLeft > 0 && straight > 50 && speed > 30 && Math.abs(angle) < 4 && skill > 0.85;
}

const SAVE = "stuntcar.league.v1";
function newLeague() {

  return { season: 1, race: 0, damage: 0, summary: "", drivers: [d("You", 0, 4, true),
    d("Rocket Ron", .80, 4), d("Jumping Jess", .84, 4), d("Dodgy Dave", .86, 3), d("Crusher Clyde", .88, 3), d("Hot Wheels Hana", .90, 3),
    d("Big Air Bill", .91, 2), d("Turbo Tess", .93, 2), d("Daredevil Dev", .95, 2), d("Max Boost", .96, 1), d("High Flyer Flo", .98, 1), d("Steel Eye", 1.0, 1)] };

function loadLeague() { try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.drivers && s.drivers.length === 12) return s; } catch (e) {} return newLeague(); }

let league = loadLeague();
const L = {
  player: () => league.drivers.find((d) => d.isPlayer),
  div: () => L.player().division,

  rivals: () => league.drivers.filter((d) => d.division === L.div() && !d.isPlayer).sort((a, b) => a.name.localeCompare(b.name)),

  rival: () => L.rivals()[league.race % 2],

  league.damage = wrecked ? 50 : damage;

  league.race++;

    const old = L.div();

    for (let dv = 1; dv <= 4; dv++) { const t = tables[dv]; if (dv > 1) t[0].division = dv - 1; if (dv < 4) t[2].division = dv + 1; }
    const nd = p.division;

const LAPS = 3;
const game = { state: "menu", mode: "league", sel: 0, track: null, player: null, rival: null, t0: 0, now: 0, banner: "", bannerUntil: 0, camMode: "chase", rivalSkill: 0.9, result: null };

  game.track = new Track(def); trackGroup = buildTrackMesh(game.track); scene.add(trackGroup);

    <div class="row">${game.mode === "league" ? '<button class="go" id="rs-next">LEAGUE TABLE</button>' : '<button class="go" id="rs-again">RACE AGAIN</button><button class="ghost" id="rs-menu">MENU</button>'}</div></div>`;
  if ($("rs-next")) $("rs-next").onclick = showLeague;
  if ($("rs-again")) $("rs-again").onclick = startRace;
  if ($("rs-menu")) $("rs-menu").onclick = showMenu;
}

// ============================================================== camera
function snapCamera() {
  const car = game.player.car, f = car.fwd.setY(0).normalize();
  camState.fwd.copy(f); camState.pos.copy(car.p).addScaledVector(f, -7.5).add(new V3(0, 2.7, 0)); camState.vel.set(0, 0, 0);
}
function updateCamera(dt) {
  if (!game.player) {
    const a = game.now * 0.08, d = trackRadius * 1.1 + 40;
    camera.position.set(trackCentre.x + Math.cos(a) * d, trackRadius * 0.45 + 25, trackCentre.z + Math.sin(a) * d);
    camera.lookAt(trackCentre); camera.fov = 60; camera.updateProjectionMatrix();
    sun.position.copy(trackCentre).addScaledVector(SUN_DIR, 200); sun.target.position.copy(trackCentre);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -trackRadius; sun.shadow.camera.right = sun.shadow.camera.top = trackRadius; sun.shadow.camera.updateProjectionMatrix();
    return;
  }
  const car = game.player.car, sp = Math.abs(car.speed);
  if (game.camMode === "chase") {
    const f = car.fwd.setY(0); if (f.lengthSq() > 1e-3) camState.fwd.lerp(f.normalize(), 1 - Math.exp(-3 * dt)).normalize();
    const want = car.p.clone().addScaledVector(camState.fwd, -7.5).add(new V3(0, 2.7, 0));
    // critically damped follow (SmoothDamp, 0.12 s)
    const omega = 2 / 0.12, x = omega * dt, e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const change = camState.pos.clone().sub(want), temp = camState.vel.clone().addScaledVector(change, omega).multiplyScalar(dt);
    camState.vel.sub(temp.clone().multiplyScalar(omega)).multiplyScalar(e);
    camState.pos.copy(want).add(change.add(temp).multiplyScalar(e));
    camera.position.copy(camState.pos);
    camera.lookAt(car.p.clone().add(new V3(0, 1.1, 0)).addScaledVector(camState.fwd, 4));
    camera.fov = lerp(camera.fov, 60 + sp * 0.25 + (car.boosting ? 6 : 0), 1 - Math.exp(-3 * dt));
  } else {
    camera.position.copy(car.world(new V3(0, 1.32, -0.35)));
    const look = car.world(new V3(0, 0.85, 12));
    camera.up.copy(car.up); camera.lookAt(look); camera.up.set(0, 1, 0);
    camera.fov = lerp(camera.fov, 72 + sp * 0.15 + (car.boosting ? 5 : 0), 1 - Math.exp(-3 * dt));
  }
  if (camState.shake > 0) { camera.position.add(new V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(camState.shake * 0.5)); camState.shake = Math.max(0, camState.shake - dt * 2); }
  camera.updateProjectionMatrix();
  sun.position.copy(car.p).addScaledVector(SUN_DIR, 150); sun.target.position.copy(car.p);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -60; sun.shadow.camera.right = sun.shadow.camera.top = 60; sun.shadow.camera.updateProjectionMatrix();
}

// ============================================================== HUD
const fmt = (t) => { if (!isFinite(t)) return "--:--.--"; const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, "0")}`; };
const CRACK = (() => { let y = 20, s = 42; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647); const pts = []; for (let i = 0; i <= 80; i++) { y = clamp(y + (r() * 2 - 1) * 5, 9, 33); pts.push([10 + i * 5.5, y]); } return pts; })();
let lastCrack = -1;
function updateHud() {
  const p = game.player; if (!p) return;
  const car = p.car, dmg = Math.round(car.damage);
  if (dmg !== lastCrack) { lastCrack = dmg; $("crack").setAttribute("points", CRACK.slice(0, Math.round(dmg / 100 * 80) + 1).map((q) => q.join(",")).join(" ")); }
  $("lap").textContent = game.mode === "practice" ? `PRACTICE LAP ${p.laps + 1}` : `LAP ${Math.min(p.laps + 1, LAPS)}/${LAPS}`;
  $("t-cur").textContent = fmt(game.state === "racing" ? game.now - p.lapStart : 0);
  $("t-last").textContent = fmt(p.last); $("t-best").textContent = fmt(p.best);
  $("boost").style.transform = `scaleX(${car.boostLeft / CFG.boostCap})`;
  $("speed").textContent = Math.round(Math.abs(car.speed) * MPH);
  if (game.rival) {
    let ahead = p.progress >= game.rival.progress || (game.rival.car.wrecked && !car.wrecked);
    if (p.finished && game.rival.finished) ahead = p.finishTime <= game.rival.finishTime;
    $("pos").textContent = ahead ? "1ST" : "2ND"; $("vs").textContent = "v " + game.rival.name;
  }
  let b = "";
  if (game.state === "countdown") b = String(Math.max(1, 3 - Math.floor(game.now - game.t0)));
  else if (game.banner && game.now < game.bannerUntil) b = game.banner;
  $("banner").textContent = b;
  $("crane").hidden = !p.crane;
}

// ============================================================== main loop
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const DT = 1 / 120;
let acc = 0, last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (t - last) / 1000); last = t; game.now += dt;
  const c = controls(), edge = c.pad ? c.pad.edge : {};
  const tap = (code) => { const h = pressed.has(code); return h; };
  const enter = tap("Enter") || tap("NumpadEnter") || (game.state !== "racing" && game.state !== "countdown" && (edge.a || edge.start));
  const backMenu = tap("Escape") || edge.b;
  const backRace = tap("Escape") || edge.start;

  if (game.state === "menu") {
    if (tap("ArrowLeft") || edge.left) { const ms = ["league", "race", "practice"]; game.mode = ms[(ms.indexOf(game.mode) + 2) % 3]; loadTrack(menuTrack()); renderMenu(); }
    if (tap("ArrowRight") || edge.right) { const ms = ["league", "race", "practice"]; game.mode = ms[(ms.indexOf(game.mode) + 1) % 3]; loadTrack(menuTrack()); renderMenu(); }
    if (game.mode !== "league" && (tap("ArrowDown") || edge.down)) { game.sel = (game.sel + 1) % TRACKS.length; loadTrack(menuTrack()); renderMenu(); }
    if (game.mode !== "league" && (tap("ArrowUp") || edge.up)) { game.sel = (game.sel + TRACKS.length - 1) % TRACKS.length; loadTrack(menuTrack()); renderMenu(); }
    if (enter) menuGo();
  } else if (game.state === "league") {
    if (enter) startRace(); else if (backMenu) showMenu();
  } else if (game.state === "finished") {
    if (enter) { game.mode === "league" ? showLeague() : startRace(); }
    else if (backMenu) { game.mode === "league" ? showLeague() : showMenu(); }
  } else if (game.state === "countdown" || game.state === "racing") {
    if (backRace) { pressed.clear(); leaveRace(); return; }
    if (game.state === "countdown" && game.now - game.t0 >= 3) {
      game.state = "racing"; game.raceStart = game.now;
      for (const r of [game.player, game.rival]) if (r) { r.car.locked = false; r.lapStart = game.now; }
      setBanner("GO!", 1);
    }
    if (tap("KeyC") || edge.y) game.camMode = game.camMode === "chase" ? "cockpit" : "chase";
    if (tap("KeyR") || edge.b) game.player.requestCrane();
    const pc = game.player.car; pc.steer = c.steer; pc.throttle = c.gas; pc.brake = c.brk; pc.boost = c.boost;
    if (game.state === "racing") {
      if (pc.wrecked) finish();
      else if (game.rival && game.rival.car.wrecked && !game.rival.finished) { game.rival.finished = true; game.rival.finishTime = Infinity; setBanner(game.rival.name.toUpperCase() + " IS WRECKED!", 3); }
    }
  }
  pressed.clear();

  if (game.player) {
    acc += dt;
    while (acc >= DT) {
      acc -= DT;
      if (game.rival) aiDrive(game.rival, game.rival.skill);
      for (const r of [game.player, game.rival]) if (r) r.car.step(DT, game.track);
      if (game.rival) carVsCar(game.player.car, game.rival.car);
    }
    for (const r of [game.player, game.rival]) if (r) { r.update(dt, game.now); r.car.sync(); tyreSmoke(r.car, dt); }
    if (actx) for (const r of [game.player, game.rival]) if (r) updateEngine(r.car, game.player.car.p);
  }
  padRumble(game.player ? game.player.car : null, dt);
  updateParticles(dt);
  updateCamera(dt);
  if (game.state === "countdown" || game.state === "racing" || game.state === "finished") updateHud();
  renderer.render(scene, camera);
}
function carVsCar(a, b) {
  if (a.kinematic || b.kinematic) return;
  for (const za of [-1.2, 1.2]) for (const zb of [-1.2, 1.2]) {
    const pa = a.world(new V3(0, 0.3, za)), pb = b.world(new V3(0, 0.3, zb)), d = pa.distanceTo(pb), R = 2.0;
    if (d < R && d > 1e-3) {
      const n = new V3().subVectors(pa, pb).multiplyScalar(1 / d), vr = a.pointVel(pa).sub(b.pointVel(pb)).dot(n);
      a.p.addScaledVector(n, (R - d) * 0.5); b.p.addScaledVector(n, -(R - d) * 0.5);
      if (vr < 0) {
        const j = -1.2 * vr / (2 / CFG.mass);
        a.impulse(n.clone().multiplyScalar(j), pa); b.impulse(n.clone().multiplyScalar(-j), pb);
        const hit = -vr; if (a.isPlayer || b.isPlayer) rumbleClunk(hit);
        if (hit > CFG.hitThr * 1.6) { a.addDamage((hit - CFG.hitThr * 1.6) * CFG.hitScale); b.addDamage((hit - CFG.hitThr * 1.6) * CFG.hitScale); }
      }
    }
  }
}

// Debug/test hook (used by automated checks; harmless otherwise).
window.__scr = { game, TRACKS, startRace, showMenu, showLeague, setMode: (m) => { game.mode = m; }, keys, league: () => league, Track, Car, Racer, aiDrive, MAT, DT };
showMenu();
requestAnimationFrame(frame);
})();
</script>
